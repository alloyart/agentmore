name: Deploy AgentMore to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble original video
        run: |
          cat assets/chunks/design-improvements.mp4.part* > dist/slides/design-improvements.mp4
          echo "91e4c9d6d00a02fe894cabdf6b6f61b28eaaac4e944e24f2d1e48bb650de1a33  dist/slides/design-improvements.mp4" | sha256sum -c -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
